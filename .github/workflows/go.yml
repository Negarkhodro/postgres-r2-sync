name: Go Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Add this line for release creation permissions

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            output_name: app-linux
            asset_name: app-linux-amd64
          - os: windows-latest
            output_name: app-windows.exe
            asset_name: app-windows-amd64
          - os: macos-latest
            output_name: app-macos
            asset_name: app-macos-amd64

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'  # Use a stable version

      - name: Build
        run: go build -v -o ${{ matrix.output_name }} ./main.go
        # If your main.go is elsewhere, adjust the path accordingly

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts  # Specify a download path

      - name: List files
        run: ls -R ./artifacts
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/app-linux-amd64/app-linux
            ./artifacts/app-windows-amd64/app-windows.exe
            ./artifacts/app-macos-amd64/app-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}